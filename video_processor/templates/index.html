<!-- index.html - 修改部分 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频背景去除工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            font-weight: 300;
            color: #a8d8ea;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 20px;
        }

        /* 控制面板 */
        .panel {
            background: #16213e;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            height: fit-content;
        }

        .panel label {
            display: block;
            font-size: 0.85rem;
            color: #8a9bb5;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .panel .value-display {
            float: right;
            color: #a8d8ea;
            font-weight: 600;
        }

        .panel input[type="range"] {
            width: 100%;
            margin: 8px 0 16px;
            -webkit-appearance: none;
            background: transparent;
        }

        .panel input[type="range"]::-webkit-slider-runnable-track {
            height: 4px;
            background: #2a3a5e;
            border-radius: 2px;
        }

        .panel input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #a8d8ea;
            margin-top: -7px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(168, 216, 234, 0.3);
        }

        .panel input[type="range"]::-moz-range-track {
            height: 4px;
            background: #2a3a5e;
            border-radius: 2px;
            border: none;
        }

        .panel input[type="range"]::-moz-range-thumb {
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #a8d8ea;
            cursor: pointer;
            border: none;
        }

        /* 切换开关样式 */
        .switch-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a1a2e;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 8px 0 16px;
            border: 1px solid #2a3a5e;
        }

        .switch-container .label-text {
            font-size: 0.85rem;
            color: #8a9bb5;
            font-weight: 500;
        }

        .switch-container .label-text .highlight {
            color: #a8d8ea;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #2a3a5e;
            transition: 0.3s;
            border-radius: 26px;
        }

        .slider::before {
            content: "";
            position: absolute;
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background: #8a9bb5;
            transition: 0.3s;
            border-radius: 50%;
        }

        .switch input:checked + .slider {
            background: #a8d8ea;
        }

        .switch input:checked + .slider::before {
            transform: translateX(24px);
            background: #1a1a2e;
        }

        .switch .status-label {
            position: absolute;
            font-size: 0.6rem;
            font-weight: 600;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            transition: 0.3s;
        }

        .switch .status-label.on {
            left: 7px;
            color: #1a1a2e;
            opacity: 0;
        }

        .switch .status-label.off {
            right: 7px;
            color: #8a9bb5;
            opacity: 1;
        }

        .switch input:checked + .slider .status-label.on {
            opacity: 1;
        }

        .switch input:checked + .slider .status-label.off {
            opacity: 0;
        }

        .upload-area {
            border: 2px dashed #2a3a5e;
            border-radius: 10px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 16px;
        }

        .upload-area:hover {
            border-color: #a8d8ea;
            background: rgba(168, 216, 234, 0.05);
        }

        .upload-area.dragover {
            border-color: #a8d8ea;
            background: rgba(168, 216, 234, 0.1);
        }

        .upload-area .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }

        .upload-area p {
            color: #8a9bb5;
            font-size: 0.9rem;
        }

        .upload-area .filename {
            color: #a8d8ea;
            font-weight: 500;
            margin-top: 8px;
            word-break: break-all;
        }

        .btn {
            display: inline-block;
            padding: 12px 32px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-align: center;
        }

        .btn-primary {
            background: #a8d8ea;
            color: #1a1a2e;
        }

        .btn-primary:hover {
            background: #8ec6d9;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(168, 216, 234, 0.2);
        }

        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-danger {
            background: #e74c6f;
            color: #fff;
        }

        .btn-danger:hover {
            background: #c0395b;
        }

        .btn-secondary {
            background: #2a3a5e;
            color: #a8d8ea;
        }

        .btn-secondary:hover {
            background: #3a4a6e;
        }

        .btn-success {
            background: #2ecc71;
            color: #1a1a2e;
        }

        .btn-success:hover {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(46, 204, 113, 0.2);
        }

        .btn-success:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn-group .btn {
            flex: 1;
        }

        .export-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .export-group .btn {
            flex: 1;
            padding: 10px 16px;
            font-size: 0.9rem;
        }

        .prefix-input-group {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 10px;
        }

        .prefix-input-group label {
            font-size: 0.85rem;
            color: #8a9bb5;
            white-space: nowrap;
            margin-bottom: 0;
        }

        .prefix-input-group input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #2a3a5e;
            background: #1a1a2e;
            color: #e0e0e0;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .prefix-input-group input:focus {
            border-color: #a8d8ea;
        }

        .progress-container {
            margin: 16px 0;
            display: none;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar {
            height: 6px;
            background: #2a3a5e;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #a8d8ea, #7ec8d9);
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #8a9bb5;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin: 12px 0;
            font-size: 0.85rem;
            color: #8a9bb5;
        }

        .stats span {
            background: #1a1a2e;
            padding: 8px 12px;
            border-radius: 6px;
            text-align: center;
        }

        .stats .num {
            color: #a8d8ea;
            font-weight: 600;
            display: block;
            font-size: 1.1rem;
        }

        /* 预览区域 */
        .preview-area {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            min-height: 500px;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .preview-header h2 {
            font-size: 1.1rem;
            font-weight: 500;
            color: #8a9bb5;
        }

        .preview-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .preview-controls button {
            background: #2a3a5e;
            border: none;
            color: #a8d8ea;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .preview-controls button:hover {
            background: #3a4a6e;
        }

        .preview-controls button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .preview-container {
            background: repeating-conic-gradient(#2a3a5e 0% 25%, #1a2a4e 0% 50%) 0 0 / 20px 20px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-container canvas {
            width: 100%;
            max-width: 520px;
            height: auto;
            aspect-ratio: 1/1;
            image-rendering: pixelated;
            display: block;
            background: transparent;
        }

        .preview-container .placeholder {
            color: #4a5a7e;
            font-size: 1rem;
            text-align: center;
            padding: 40px;
        }

        .preview-container .placeholder .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }

        .frame-counter {
            text-align: center;
            color: #4a5a7e;
            font-size: 0.85rem;
            margin-top: 12px;
        }

        .thumbnail-strip {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding: 8px 0;
            margin-top: 12px;
            max-height: 80px;
            scrollbar-width: thin;
            scrollbar-color: #2a3a5e transparent;
        }

        .thumbnail-strip::-webkit-scrollbar {
            height: 4px;
        }

        .thumbnail-strip::-webkit-scrollbar-thumb {
            background: #2a3a5e;
            border-radius: 2px;
        }

        .thumbnail-strip img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            image-rendering: pixelated;
        }

        .thumbnail-strip img:hover {
            border-color: #a8d8ea;
        }

        .thumbnail-strip img.active {
            border-color: #a8d8ea;
            box-shadow: 0 0 15px rgba(168, 216, 234, 0.3);
        }

        /* 响应式 */
        @media (max-width: 1024px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .panel {
                padding: 16px;
            }
            .btn-group {
                flex-direction: column;
            }
            .export-group {
                flex-direction: column;
            }
            .stats {
                grid-template-columns: 1fr;
            }
            .prefix-input-group {
                flex-wrap: wrap;
            }
            .switch-container {
                flex-wrap: wrap;
                gap: 8px;
            }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #16213e;
            color: #e0e0e0;
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 1000;
            max-width: 400px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.error {
            border-color: #e74c6f;
        }

        .toast.success {
            border-color: #2ecc71;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 视频背景去除 · 帧处理</h1>

        <div class="grid">
            <!-- 控制面板 -->
            <div class="panel">
                <div class="upload-area" id="uploadArea">
                    <span class="icon">📤</span>
                    <p>拖拽或点击上传视频</p>
                    <div class="filename" id="fileName">未选择文件</div>
                    <input type="file" id="fileInput" accept="video/*" style="display:none">
                </div>

                <label>采样帧率 (FPS)
                    <span class="value-display" id="fpsValue">8</span>
                </label>
                <input type="range" id="fpsSlider" min="1" max="30" value="8">

                <label>背景色容差
                    <span class="value-display" id="toleranceValue">35</span>
                </label>
                <input type="range" id="toleranceSlider" min="0" max="80" value="35">

                <!-- AI/纯色切换开关 -->
                <div class="switch-container">
                    <span class="label-text">
                        🤖 <span class="highlight">AI</span> 智能去背景
                    </span>
                    <label class="switch">
                        <input type="checkbox" id="aiSwitch" checked>
                        <span class="slider">
                            <span class="status-label on">开</span>
                            <span class="status-label off">关</span>
                        </span>
                    </label>
                </div>
                <div style="font-size: 0.75rem; color: #4a5a7e; margin-top: -10px; margin-bottom: 12px; text-align: center;">
                    💡 开启 = AI模型 + 纯色检测 | 关闭 = 仅纯色检测
                </div>

                <button class="btn btn-primary" id="processBtn" disabled>🚀 开始处理</button>

                <div class="btn-group">
                    <button class="btn btn-secondary" id="clearBtn" disabled>🗑️ 清除结果</button>
                </div>

                <!-- 导出区域 -->
                <div class="prefix-input-group">
                    <label for="prefixInput">前缀名</label>
                    <input type="text" id="prefixInput" value="frame_" placeholder="例如: walk_">
                </div>
                <div class="export-group">
                    <button class="btn btn-success" id="exportBtn" disabled>💾 导出帧</button>
                    <button class="btn btn-success" id="exportZipBtn" disabled>📦 导出ZIP</button>
                </div>

                <div class="progress-container" id="progressContainer">
                    <div class="progress-text">
                        <span id="progressText">准备中...</span>
                        <span id="frameCount">0 / 0</span>
                    </div>
                    <div class="progress-bar">
                        <div class="fill" id="progressFill"></div>
                    </div>
                </div>

                <div class="stats">
                    <span>总帧数 <span class="num" id="totalFrames">0</span></span>
                    <span>处理帧 <span class="num" id="processedFrames">0</span></span>
                    <span>尺寸 <span class="num">260×260</span></span>
                </div>
            </div>

            <!-- 预览区域 -->
            <div class="preview-area">
                <div class="preview-header">
                    <h2>🖼️ 帧预览</h2>
                    <div class="preview-controls">
                        <button id="playBtn" disabled title="播放/暂停">▶</button>
                        <button id="prevBtn" disabled title="上一帧">◀</button>
                        <button id="nextBtn" disabled title="下一帧">▶</button>
                    </div>
                </div>

                <div class="preview-container" id="previewContainer">
                    <div class="placeholder" id="placeholder">
                        <span class="icon">🎥</span>
                        <p>上传视频并开始处理<br>处理完成后将显示帧预览</p>
                    </div>
                    <canvas id="previewCanvas" style="display:none"></canvas>
                </div>

                <div class="frame-counter" id="frameCounter">0 / 0</div>

                <div class="thumbnail-strip" id="thumbnailStrip"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============ 状态管理 ============
        const state = {
            frames: [],
            currentIndex: 0,
            isPlaying: false,
            playInterval: null,
            isProcessing: false,
            file: null,
        };

        // ============ DOM引用 ============
        const elements = {
            uploadArea: document.getElementById('uploadArea'),
            fileInput: document.getElementById('fileInput'),
            fileName: document.getElementById('fileName'),
            fpsSlider: document.getElementById('fpsSlider'),
            fpsValue: document.getElementById('fpsValue'),
            toleranceSlider: document.getElementById('toleranceSlider'),
            toleranceValue: document.getElementById('toleranceValue'),
            aiSwitch: document.getElementById('aiSwitch'),
            processBtn: document.getElementById('processBtn'),
            clearBtn: document.getElementById('clearBtn'),
            exportBtn: document.getElementById('exportBtn'),
            exportZipBtn: document.getElementById('exportZipBtn'),
            prefixInput: document.getElementById('prefixInput'),
            progressContainer: document.getElementById('progressContainer'),
            progressFill: document.getElementById('progressFill'),
            progressText: document.getElementById('progressText'),
            frameCount: document.getElementById('frameCount'),
            totalFrames: document.getElementById('totalFrames'),
            processedFrames: document.getElementById('processedFrames'),
            previewCanvas: document.getElementById('previewCanvas'),
            placeholder: document.getElementById('placeholder'),
            frameCounter: document.getElementById('frameCounter'),
            thumbnailStrip: document.getElementById('thumbnailStrip'),
            playBtn: document.getElementById('playBtn'),
            prevBtn: document.getElementById('prevBtn'),
            nextBtn: document.getElementById('nextBtn'),
            toast: document.getElementById('toast'),
        };

        // ============ 工具函数 ============
        function showToast(message, type = 'info') {
            const t = elements.toast;
            t.textContent = message;
            t.className = 'toast ' + type + ' show';
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 3000);
        }

        function formatTime(ms) {
            const s = Math.floor(ms / 1000);
            const m = Math.floor(s / 60);
            return `${m}:${String(s % 60).padStart(2, '0')}`;
        }

        // ============ 文件上传 ============
        elements.uploadArea.addEventListener('click', () => elements.fileInput.click());
        elements.uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            elements.uploadArea.classList.add('dragover');
        });
        elements.uploadArea.addEventListener('dragleave', () => {
            elements.uploadArea.classList.remove('dragover');
        });
        elements.uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            elements.uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        elements.fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('video/')) {
                showToast('请上传视频文件', 'error');
                return;
            }
            state.file = file;
            elements.fileName.textContent = file.name;
            elements.processBtn.disabled = false;
            showToast(`已加载: ${file.name}`, 'success');
            
            // 上传到服务器
            uploadVideo(file);
        }

        // ============ API调用 ============
        async function uploadVideo(file) {
            const formData = new FormData();
            formData.append('video', file);

            try {
                const res = await fetch('/upload', {
                    method: 'POST',
                    body: formData,
                });
                const data = await res.json();
                if (data.error) {
                    showToast(data.error, 'error');
                    return;
                }
                showToast('视频上传成功', 'success');
            } catch (e) {
                showToast('上传失败: ' + e.message, 'error');
            }
        }

        async function startProcessing() {
            if (state.isProcessing) return;

            const fps = parseInt(elements.fpsSlider.value);
            const tolerance = parseInt(elements.toleranceSlider.value);
            const use_ai = elements.aiSwitch.checked;

            elements.processBtn.disabled = true;
            elements.processBtn.textContent = '⏳ 处理中...';
            elements.progressContainer.classList.add('active');
            state.isProcessing = true;
            state.frames = [];
            state.currentIndex = 0;
            elements.exportBtn.disabled = true;
            elements.exportZipBtn.disabled = true;

            try {
                const res = await fetch('/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fps, tolerance, use_ai }),
                });
                const data = await res.json();
                if (data.error) {
                    showToast(data.error, 'error');
                    elements.processBtn.disabled = false;
                    elements.processBtn.textContent = '🚀 开始处理';
                    state.isProcessing = false;
                    return;
                }
                // 开始轮询状态
                pollStatus();
            } catch (e) {
                showToast('启动处理失败: ' + e.message, 'error');
                elements.processBtn.disabled = false;
                elements.processBtn.textContent = '🚀 开始处理';
                state.isProcessing = false;
            }
        }

        async function pollStatus() {
            try {
                const res = await fetch('/status');
                const data = await res.json();

                // 更新进度
                elements.progressFill.style.width = data.progress + '%';
                elements.progressText.textContent = data.is_processing ? '处理中...' : '完成！';
                elements.frameCount.textContent = `${data.processed} / ${data.total}`;
                elements.totalFrames.textContent = data.total || 0;
                elements.processedFrames.textContent = data.processed || 0;

                if (data.is_processing) {
                    // 继续轮询
                    setTimeout(pollStatus, 500);
                } else {
                    // 处理完成，获取帧数据
                    state.isProcessing = false;
                    elements.processBtn.textContent = '✅ 完成';
                    elements.processBtn.disabled = false;
                    await loadFrames();
                    showToast(`处理完成！共 ${state.frames.length} 帧`, 'success');
                }
            } catch (e) {
                console.error('轮询失败:', e);
                setTimeout(pollStatus, 1000);
            }
        }

        async function loadFrames() {
            try {
                const res = await fetch('/frames?start=0&end=500');
                const data = await res.json();
                state.frames = data.frames || [];
                if (state.frames.length > 0) {
                    renderFrames();
                    elements.clearBtn.disabled = false;
                    elements.exportBtn.disabled = false;
                    elements.exportZipBtn.disabled = false;
                    elements.playBtn.disabled = false;
                    elements.prevBtn.disabled = false;
                    elements.nextBtn.disabled = false;
                }
            } catch (e) {
                showToast('加载帧数据失败: ' + e.message, 'error');
            }
        }

        async function clearResults() {
            try {
                await fetch('/clear', { method: 'POST' });
                state.frames = [];
                state.currentIndex = 0;
                state.isPlaying = false;
                if (state.playInterval) {
                    clearInterval(state.playInterval);
                    state.playInterval = null;
                }
                elements.playBtn.textContent = '▶';
                elements.previewCanvas.style.display = 'none';
                elements.placeholder.style.display = 'block';
                elements.thumbnailStrip.innerHTML = '';
                elements.frameCounter.textContent = '0 / 0';
                elements.totalFrames.textContent = '0';
                elements.processedFrames.textContent = '0';
                elements.progressFill.style.width = '0%';
                elements.progressText.textContent = '已清除';
                elements.clearBtn.disabled = true;
                elements.exportBtn.disabled = true;
                elements.exportZipBtn.disabled = true;
                elements.playBtn.disabled = true;
                elements.prevBtn.disabled = true;
                elements.nextBtn.disabled = true;
                elements.processBtn.textContent = '🚀 开始处理';
                elements.processBtn.disabled = false;
                elements.progressContainer.classList.remove('active');
                showToast('已清除所有结果', 'info');
            } catch (e) {
                showToast('清除失败: ' + e.message, 'error');
            }
        }

        // ============ 导出功能 ============
        async function exportFrames(asZip = false) {
            if (state.frames.length === 0) {
                showToast('没有可导出的帧', 'error');
                return;
            }

            const prefix = elements.prefixInput.value.trim() || 'frame_';
            const endpoint = asZip ? '/export/zip' : '/export';

            try {
                elements.exportBtn.disabled = true;
                elements.exportZipBtn.disabled = true;

                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prefix }),
                });

                if (asZip) {
                    // ZIP下载
                    if (res.ok) {
                        const blob = await res.blob();
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `frames_${new Date().toISOString().slice(0,10)}.zip`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        showToast('ZIP导出成功！', 'success');
                    } else {
                        const error = await res.json();
                        showToast(error.error || '导出失败', 'error');
                    }
                } else {
                    // 普通导出
                    const data = await res.json();
                    if (data.error) {
                        showToast(data.error, 'error');
                    } else {
                        showToast(`导出成功！共 ${data.exported} 帧，保存在 ${data.directory}`, 'success');
                    }
                }
            } catch (e) {
                showToast('导出失败: ' + e.message, 'error');
            } finally {
                elements.exportBtn.disabled = false;
                elements.exportZipBtn.disabled = false;
            }
        }

        // ============ 渲染预览 ============
        function renderFrames() {
            const canvas = elements.previewCanvas;
            const ctx = canvas.getContext('2d');
            
            // 设置canvas尺寸为260x260 (显示时保持比例)
            canvas.width = 260;
            canvas.height = 260;
            canvas.style.display = 'block';
            elements.placeholder.style.display = 'none';

            if (state.frames.length > 0) {
                showFrame(0);
                renderThumbnails();
                elements.frameCounter.textContent = `1 / ${state.frames.length}`;
            }
        }

        function showFrame(index) {
            const canvas = elements.previewCanvas;
            const ctx = canvas.getContext('2d');
            
            if (index < 0 || index >= state.frames.length || !state.frames[index]) {
                return;
            }

            const img = new Image();
            img.onload = () => {
                canvas.width = 260;
                canvas.height = 260;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, 260, 260);
                
                // 更新缩略图高亮
                const thumbs = elements.thumbnailStrip.querySelectorAll('img');
                thumbs.forEach((el, i) => {
                    el.classList.toggle('active', i === index);
                });
            };
            img.src = 'data:image/png;base64,' + state.frames[index];
            
            state.currentIndex = index;
            elements.frameCounter.textContent = `${index + 1} / ${state.frames.length}`;
        }

        function renderThumbnails() {
            const strip = elements.thumbnailStrip;
            strip.innerHTML = '';
            
            const maxThumbs = Math.min(state.frames.length, 100);
            const step = Math.max(1, Math.floor(state.frames.length / maxThumbs));
            
            for (let i = 0; i < state.frames.length; i += step) {
                const img = document.createElement('img');
                img.src = 'data:image/png;base64,' + state.frames[i];
                img.dataset.index = i;
                img.addEventListener('click', () => {
                    if (state.isPlaying) togglePlay();
                    showFrame(i);
                });
                strip.appendChild(img);
            }
        }

        // ============ 播放控制 ============
        function togglePlay() {
            if (state.frames.length === 0) return;
            
            state.isPlaying = !state.isPlaying;
            elements.playBtn.textContent = state.isPlaying ? '⏸' : '▶';
            
            if (state.isPlaying) {
                if (state.currentIndex >= state.frames.length - 1) {
                    state.currentIndex = 0;
                }
                state.playInterval = setInterval(() => {
                    let next = state.currentIndex + 1;
                    if (next >= state.frames.length) {
                        next = 0;
                    }
                    showFrame(next);
                }, 1000 / 8); // 8fps播放
            } else {
                if (state.playInterval) {
                    clearInterval(state.playInterval);
                    state.playInterval = null;
                }
            }
        }

        function prevFrame() {
            if (state.isPlaying) togglePlay();
            const idx = state.currentIndex > 0 ? state.currentIndex - 1 : state.frames.length - 1;
            showFrame(idx);
        }

        function nextFrame() {
            if (state.isPlaying) togglePlay();
            const idx = state.currentIndex < state.frames.length - 1 ? state.currentIndex + 1 : 0;
            showFrame(idx);
        }

        // ============ 事件绑定 ============
        elements.fpsSlider.addEventListener('input', () => {
            elements.fpsValue.textContent = elements.fpsSlider.value;
        });

        elements.toleranceSlider.addEventListener('input', () => {
            elements.toleranceValue.textContent = elements.toleranceSlider.value;
        });

        elements.processBtn.addEventListener('click', startProcessing);
        elements.clearBtn.addEventListener('click', clearResults);
        elements.exportBtn.addEventListener('click', () => exportFrames(false));
        elements.exportZipBtn.addEventListener('click', () => exportFrames(true));
        elements.playBtn.addEventListener('click', togglePlay);
        elements.prevBtn.addEventListener('click', prevFrame);
        elements.nextBtn.addEventListener('click', nextFrame);

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
            if (e.key === 'ArrowRight') nextFrame();
            if (e.key === 'ArrowLeft') prevFrame();
        });

        // ============ 初始化 ============
        console.log('🎬 视频背景处理工具已启动');
        console.log('📖 快捷键: Space=播放/暂停, ←/→=上一帧/下一帧');
        console.log('🤖 模型: u2net (可切换为纯色检测模式)');
    </script>
</body>
</html>
